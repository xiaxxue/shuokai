project_id = "shuokai"

[auth]
site_url = "https://shuokai-supabase-test.shuokai.workers.dev/"
additional_redirect_urls = ["https://shuokai-supabase-test.shuokai.workers.dev/"]
enable_manual_linking = true
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# wx.login has no Supabase session yet. This endpoint validates the one-time
# WeChat code itself and must therefore be reachable before JWT issuance.
[functions.wechat-login]
verify_jwt = false
